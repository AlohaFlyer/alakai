<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Podcast · Alakaʻi Test Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Alakaʻi">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#C8102E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Alakaʻi Test Prep">
<meta property="og:image" content="https://alakaitestprep.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  .ep { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ep.coming { cursor: default; opacity: .55; }
  .ep .n { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--primary-text); }
  .ep.done .n::after { content: " ✓"; color: var(--ok); font-size: .9rem; }
  audio { width: 100%; margin-top: 8px; }
  .cast { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html"><img class="mark" src="assets/icons/mark-72.png" alt="" width="36" height="36"><span class="name">Alakaʻi Test Prep</span></a>
    <div class="toggle" data-mount></div>
  </header>
  <nav class="tabs"></nav>

  <section class="card">
    <h2><span data-test-label>SAT</span> Notes Podcast</h2>
    <p class="muted">How to think through the test, from people who sound like home. Finish an episode, take the 3-question check, and it counts in your report.</p>
    <div class="cast" id="cast"></div>
  </section>

  <section class="card" id="player" hidden>
    <h3 id="ptitle"></h3>
    <p class="muted" id="ptopic"></p>
    <audio id="audio" controls preload="none"></audio>
    <details style="margin-top:8px"><summary>Transcript</summary><pre id="ptranscript" style="white-space:pre-wrap;font-family:inherit"></pre></details>
    <div id="homework" style="margin-top:10px"></div>
    <div id="check" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <div id="list"></div>
  </section>
</div>
<script src="assets/app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
<script>
(async () => {
  const A = window.Alakai, S = A.Store;
  const { profile } = await A.boot({ page: 'notes.html', gate: true }); if (!profile) return;
  let test, eps, cast;
  async function load() {
    test = A.getTest();
    let all = { sat: [], act: [], cast: [] }, failed = false; try { all = await A.data('data/episodes.json'); } catch (e) { failed = true; }
    eps = all[test] || []; cast = all.cast || [];
    document.getElementById('cast').innerHTML = cast.map(c => `<span class="chip" title="${A.esc(c.role)}">${A.esc(c.name)}</span>`).join('');
    const prog = S.get(test + '.episodes', {});
    const host = document.getElementById('list');
    host.innerHTML = eps.length ? eps.map(e => e.coming
      ? `<div class="ep coming" aria-disabled="true"><div class="n">${e.n}</div><div><strong>${A.esc(e.title)}</strong><br><small class="muted">${A.esc(e.topic)}</small></div><div class="muted">Coming soon</div></div>`
      : `<div class="ep ${prog[e.n] && prog[e.n].done ? 'done' : ''}" data-n="${e.n}" role="button" tabindex="0" aria-label="Play episode ${e.n}: ${A.esc(e.title)}${prog[e.n] && prog[e.n].done ? ', done' : ''}"><div class="n">${e.n}</div><div><strong>${A.esc(e.title)}</strong><br><small class="muted">${A.esc(e.topic)}</small></div><div class="muted">${A.esc(e.len || '')}</div></div>`).join('') : failed ? `<p class="muted" role="status">${navigator.onLine === false ? 'You are offline, and the episode list has not been saved on this device yet.' : 'The episode list did not load.'} Episodes need a connection: reconnect and reload this page.</p>` : `<p class="muted">${test.toUpperCase()} Notes Podcast, episode 1 is being recorded. Same five voices, ${test === 'act' ? 'Coach Pono finally gets his second hat' : 'different hat'}. Check back soon.</p>`;
    host.querySelectorAll('.ep:not(.coming)').forEach(d => {
      // A fast second tap on a check's Next can land here once the check shrinks: ignore taps right after one.
      d.addEventListener('click', () => { if (Date.now() - lastCheckTap < 700) return; play(+d.dataset.n); });
      d.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); play(+d.dataset.n); } });
    });
    if (eps.some(e => e.coming)) host.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:10px 0 0">More episodes are being recorded. New ones show up here as they are approved.</p>');
  }
  // Progress per episode: pos (seconds, saved every 5 s and on pause), heard (seconds actually played, which is what
  // the 90% rule counts, so scrubbing to the end does not unlock the check), listened, done, check.
  let current = null, lastCheckTap = 0;
  const isPlain = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  function play(n) {
    const e = eps.find(x => x.n === n); if (!e) return;
    if (current && current.flush) current.flush();
    const t = test; current = { n, t };
    document.getElementById('player').hidden = false; document.getElementById('ptitle').textContent = `Ep ${e.n}: ${e.title}`; document.getElementById('ptopic').textContent = e.topic;
    const a = document.getElementById('audio');
    a.ontimeupdate = a.onpause = a.onended = a.onloadedmetadata = a.onseeking = null;
    a.src = e.audio; a.load();
    // ACT Science homework while Science is off: say so, and let the drill page offer to turn it on.
    const sciOff = t === 'act' && !profile.science && e.homework && /section=science|skill=science-/.test(e.homework.href);
    document.getElementById('homework').innerHTML = e.homework ? `<a class="btn" href="${A.esc(e.homework.href)}">Homework: ${A.esc(e.homework.label)}</a>${sciOff ? '<p class="muted" style="margin:6px 0 0">Science is off in your Settings. The drill page will ask whether to turn it on.</p>' : ''}` : '';
    document.getElementById('ptranscript').textContent = e.transcript || 'Transcript coming.';
    const prog = S.get(t + '.episodes', {}); const rec = Object.assign({ n, title: e.title, done: false }, isPlain(prog[n]) ? prog[n] : {});
    const save = () => { const p = S.get(t + '.episodes', {}); p[n] = rec; S.set(t + '.episodes', p); };
    const mine = () => current && current.n === n && current.t === t;
    let lastSave = 0, lastT = null, ready = false;
    current.flush = () => { if (ready && a.currentTime > 0) { rec.pos = a.currentTime; save(); } };
    a.onloadedmetadata = () => { if (!mine()) return; if (rec.pos && a.duration && rec.pos < a.duration - 5) a.currentTime = rec.pos; lastT = a.currentTime; ready = true; };
    a.onseeking = () => { lastT = null; };
    a.ontimeupdate = () => {
      // Ignore the timeupdate the browser fires while loading, before the saved position is restored.
      if (!mine() || !ready) return;
      const now = a.currentTime;
      // Count only small forward steps of real playback as heard time; a seek resets the baseline.
      if (lastT !== null && !a.paused && now > lastT && now - lastT < 2) rec.heard = (rec.heard || 0) + (now - lastT);
      lastT = now; rec.pos = now;
      if (a.duration && !rec.listened && (rec.heard || 0) >= 0.9 * a.duration) { rec.listened = true; save(); renderCheck(e, rec, t); return; }
      if (Date.now() - lastSave >= 5000) { lastSave = Date.now(); save(); }
    };
    a.onpause = () => { if (!mine() || !ready || a.ended) return; rec.pos = a.currentTime; save(); };
    a.onended = () => { if (!mine()) return; rec.pos = 0; save(); };
    const resumeNote = rec.pos > 5 && !rec.done ? ` Resumes at ${A.fmtTime(rec.pos)}.` : '';
    document.getElementById('ptopic').textContent = e.topic + resumeNote;
    renderCheck(e, rec, t);
    document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
  }
  // Rendered once per unlock: later events (ended, more timeupdates) do not restart a check in progress.
  function renderCheck(e, rec, t) {
    const host = document.getElementById('check');
    if (!e.check || !e.check.length) { host.innerHTML = ''; return; }
    if (rec.done) { host.innerHTML = `<p class="chip ok">Check done: ${rec.check}/${e.check.length}</p>`; return; }
    if (!rec.listened) { host.innerHTML = '<p class="muted">The 3-question check unlocks when you have listened to 90% of the episode.</p>'; host.dataset.ep = ''; return; }
    const key = t + ':' + e.n; if (host.dataset.ep === key) return; host.dataset.ep = key;
    let i = 0, score = 0;
    const next = () => {
      if (i >= e.check.length) { rec.done = true; rec.check = score; rec.doneAt = Date.now(); const prog = S.get(t + '.episodes', {}); prog[e.n] = rec; S.set(t + '.episodes', prog); const doneCount = Object.values(prog).filter(x => x && x.done).length; if (doneCount % 5 === 0 && A.milestone(t, 'eps' + doneCount)) S.set('milestone_pending', { test: t, text: `${doneCount} episodes done. Good time to send a progress report.` }); host.innerHTML = `<p class="chip ok">Check done: ${score}/${e.check.length}</p>`; host.dataset.ep = ''; if (t === test) load(); return; }
      const c = e.check[i]; host.innerHTML = `<div class="q-stem"><strong>Check ${i + 1}/${e.check.length}.</strong> ${A.esc(c.q)}</div><div class="choices">${c.choices.map((x, k) => `<button class="choice" data-k="${k}">${A.esc(x)}</button>`).join('')}</div><div id="cfb"></div>`;
      const shownAt = Date.now();
      host.querySelectorAll('.choice').forEach(b => b.addEventListener('click', async () => { if (Date.now() - shownAt < 400) return; if (b.disabled) return; const k = +b.dataset.k; host.querySelectorAll('.choice').forEach(x => x.disabled = true); b.dataset.state = k === c.answer ? 'right' : 'wrong'; if (k === c.answer) score++; else host.querySelector(`[data-k="${c.answer}"]`).dataset.state = 'right'; await A.showFeedback(host.querySelector('#cfb'), k === c.answer ? 'right' : 'wrong'); const nb = document.createElement('button'); nb.textContent = i === e.check.length - 1 ? 'Finish the check' : 'Next'; nb.style.marginTop = '8px'; nb.onclick = () => { if (nb.disabled) return; nb.disabled = true; lastCheckTap = Date.now(); i++; next(); }; host.querySelector('#cfb').appendChild(nb); }));
    };
    next();
  }
  // A test toggle closes the player so progress is never filed under the other test.
  document.addEventListener('alakai:test', () => { const a = document.getElementById('audio'); if (current) { if (current.flush) current.flush(); a.pause(); } current = null; document.getElementById('player').hidden = true; document.getElementById('check').innerHTML = ''; document.getElementById('check').dataset.ep = ''; load(); });
  await load();
  const q = new URLSearchParams(location.search); if (q.get('ep') && eps.some(e => e.n === +q.get('ep') && !e.coming)) play(+q.get('ep'));
})();
</script>
</body>
</html>
