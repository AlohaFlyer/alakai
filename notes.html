<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Podcast · Alakaʻi Test Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Alakaʻi">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#C8102E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Alakaʻi Test Prep">
<meta property="og:image" content="https://alakaitestprep.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  .ep { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ep.coming { cursor: default; opacity: .55; }
  .ep .n { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--primary); }
  .ep.done .n::after { content: " ✓"; color: var(--ok); font-size: .9rem; }
  audio { width: 100%; margin-top: 8px; }
  .cast { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html"><img class="mark" src="assets/icons/mark-72.png" alt="" width="36" height="36"><span class="name">Alakaʻi Test Prep</span></a>
    <div class="toggle" data-mount></div>
  </header>
  <nav class="tabs"></nav>

  <section class="card">
    <h2><span data-test-label>SAT</span> Notes Podcast</h2>
    <p class="muted">How to think through the test, from people who sound like home. Finish an episode, take the 3-question check, and it counts in your report.</p>
    <div class="cast" id="cast"></div>
  </section>

  <section class="card" id="player" hidden>
    <h3 id="ptitle"></h3>
    <p class="muted" id="ptopic"></p>
    <audio id="audio" controls preload="none"></audio>
    <details style="margin-top:8px"><summary>Transcript</summary><pre id="ptranscript" style="white-space:pre-wrap;font-family:inherit"></pre></details>
    <div id="check" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <div id="list"></div>
  </section>
</div>
<script src="assets/app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
<script>
(async () => {
  const A = window.Alakai, S = A.Store;
  const { profile } = await A.boot({ page: 'notes.html', gate: true }); if (!profile) return;
  let test, eps, cast;
  async function load() {
    test = A.getTest();
    let all = { sat: [], act: [], cast: [] }; try { all = await A.data('data/episodes.json'); } catch (e) {}
    eps = all[test] || []; cast = all.cast || [];
    document.getElementById('cast').innerHTML = cast.map(c => `<span class="chip" title="${A.esc(c.role)}">${A.esc(c.name)}</span>`).join('');
    const prog = S.get(test + '.episodes', {});
    const host = document.getElementById('list');
    host.innerHTML = eps.length ? eps.map(e => e.coming
      ? `<div class="ep coming" aria-disabled="true"><div class="n">${e.n}</div><div><strong>${A.esc(e.title)}</strong><br><small class="muted">${A.esc(e.topic)}</small></div><div class="muted">Coming soon</div></div>`
      : `<div class="ep ${prog[e.n] && prog[e.n].done ? 'done' : ''}" data-n="${e.n}"><div class="n">${e.n}</div><div><strong>${A.esc(e.title)}</strong><br><small class="muted">${A.esc(e.topic)}</small></div><div class="muted">${A.esc(e.len || '')}</div></div>`).join('') : `<p class="muted">${test.toUpperCase()} Notes Podcast, episode 0 is being recorded. Same five voices, ${test === 'act' ? 'Coach Pono finally gets his second hat' : 'different hat'}. Check back soon.</p>`;
    host.querySelectorAll('.ep:not(.coming)').forEach(d => d.addEventListener('click', () => play(+d.dataset.n)));
    if (eps.length) host.insertAdjacentHTML('beforeend', '<p class="muted" style="margin:10px 0 0">More episodes are being recorded. New ones show up here as they are approved.</p>');
    const q = new URLSearchParams(location.search); if (q.get('ep') && eps.some(e => e.n === +q.get('ep') && !e.coming)) play(+q.get('ep'));
  }
  function play(n) {
    const e = eps.find(x => x.n === n); if (!e) return;
    document.getElementById('player').hidden = false; document.getElementById('ptitle').textContent = `Ep ${e.n}: ${e.title}`; document.getElementById('ptopic').textContent = e.topic;
    const a = document.getElementById('audio'); a.src = e.audio; a.load();
    document.getElementById('ptranscript').textContent = e.transcript || 'Transcript coming.';
    const prog = S.get(test + '.episodes', {}); const rec = prog[n] || { n, title: e.title, done: false };
    a.ontimeupdate = () => { rec.pos = a.currentTime; if (a.duration && a.currentTime / a.duration > 0.9 && !rec.listened) { rec.listened = true; prog[n] = rec; S.set(test + '.episodes', prog); renderCheck(e, rec); } };
    if (rec.pos && rec.pos < (a.duration || 1e9)) a.currentTime = rec.pos;
    a.onended = () => { rec.listened = true; prog[n] = rec; S.set(test + '.episodes', prog); renderCheck(e, rec); };
    renderCheck(e, rec);
    document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
  }
  function renderCheck(e, rec) {
    const host = document.getElementById('check');
    if (!e.check || !e.check.length) { host.innerHTML = ''; return; }
    if (rec.done) { host.innerHTML = `<p class="chip ok">Check done: ${rec.check}/${e.check.length}</p>`; return; }
    if (!rec.listened) { host.innerHTML = '<p class="muted">The 3-question check unlocks when you have listened to the episode.</p>'; return; }
    let i = 0, score = 0;
    const next = () => {
      if (i >= e.check.length) { rec.done = true; rec.check = score; rec.doneAt = Date.now(); const prog = S.get(test + '.episodes', {}); prog[e.n] = rec; S.set(test + '.episodes', prog); const doneCount = Object.values(prog).filter(x => x.done).length; if (doneCount % 5 === 0 && A.milestone(test, 'eps' + doneCount)) S.set('milestone_pending', { test, text: `${doneCount} episodes done. Good time to send a progress report.` }); host.innerHTML = `<p class="chip ok">Check done: ${score}/${e.check.length}</p>`; load(); return; }
      const c = e.check[i]; host.innerHTML = `<div class="q-stem"><strong>Check ${i + 1}/${e.check.length}.</strong> ${A.esc(c.q)}</div><div class="choices">${c.choices.map((x, k) => `<button class="choice" data-k="${k}">${A.esc(x)}</button>`).join('')}</div><div id="cfb"></div>`;
      host.querySelectorAll('.choice').forEach(b => b.addEventListener('click', async () => { const k = +b.dataset.k; host.querySelectorAll('.choice').forEach(x => x.disabled = true); b.dataset.state = k === c.answer ? 'right' : 'wrong'; if (k === c.answer) score++; else host.querySelector(`[data-k="${c.answer}"]`).dataset.state = 'right'; await A.showFeedback(host.querySelector('#cfb'), k === c.answer ? 'right' : 'wrong'); const nb = document.createElement('button'); nb.textContent = 'Next'; nb.style.marginTop = '8px'; nb.onclick = () => { i++; next(); }; host.querySelector('#cfb').appendChild(nb); }));
    };
    next();
  }
  document.addEventListener('alakai:test', load);
  load();
})();
</script>
</body>
</html>
