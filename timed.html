<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timed · Alakaʻi Test Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="site.webmanifest">
<style>
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: calc(var(--bar) + 4px); background: var(--paper); z-index: 2; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .nav-q { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .nav-q button { width: 34px; height: 30px; padding: 0; background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); font-size: .8rem; }
  .nav-q button.answered { background: var(--primary); color: var(--on-primary); }
  .nav-q button.flagged { outline: 2px solid var(--warn); }
  .nav-q button.current { border-color: var(--ink); border-width: 2px; }
  .coach { background: color-mix(in srgb, var(--warn) 14%, transparent); border-left: 4px solid var(--warn); padding: 8px 12px; border-radius: 0 10px 10px 0; margin: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark">A</span><span class="name">Alakaʻi Test Prep</span></a>
    <div class="toggle" data-mount></div>
  </header>
  <nav class="tabs"></nav>

  <section class="card" id="picker">
    <h2>Timed sections</h2>
    <p class="muted">Real clock. No guessing penalty on either test, so never leave a blank. Two passes: answer what you know, flag what you don't, come back. Pacing checkpoints are set by your onboarding answer (change in Settings).</p>
    <div class="grid" id="modules"></div>
  </section>

  <section class="card" id="run" hidden>
    <div class="hud">
      <div><strong id="mname"></strong><br><small class="muted" id="pace"></small></div>
      <div class="clock" id="clock">0:00</div>
      <button class="secondary" id="finish">Finish</button>
    </div>
    <div class="nav-q" id="navq"></div>
    <div id="coach"></div>
    <div id="item" style="margin-top:12px"></div>
    <div class="row" style="margin-top:10px"><button class="secondary" id="prev">Back</button><button id="next">Next</button></div>
  </section>

  <section class="card" id="review" hidden>
    <h2>Section pau</h2>
    <p id="rsummary"></p>
    <div class="row"><button id="rshow">Review every item</button><button class="secondary" id="rsend">Send progress report</button><a class="btn secondary" href="dashboard.html">Dashboard</a></div>
    <div id="rlist" style="margin-top:14px"></div>
  </section>
</div>
<script src="assets/app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
<script src="assets/engine.js"></script>
<script>
(async () => {
  const A = window.Alakai, E = window.AlakaiEngine, S = A.Store;
  const { profile } = await A.boot({ page: 'timed.html', gate: true }); if (!profile) return;
  let test, bank, timed;
  async function load() {
    test = A.getTest(); bank = await E.Bank.load(test); timed = await A.data(`data/${test}/timed.json`);
    const host = document.getElementById('modules'); host.innerHTML = '';
    timed.modules.filter(m => !(test === 'act' && m.section === 'science' && !profile.science)).forEach(m => {
      const pool = bank.items.filter(i => i.section === m.section && i.timed_ok !== false).length;
      const d = document.createElement('div'); d.className = 'card'; d.style.boxShadow = 'none';
      d.innerHTML = `<h3>${A.esc(m.name)}</h3><p class="muted">${m.count} questions · ${m.minutes} min · ${Math.round(m.minutes * 60 / m.count)}s each</p><button ${pool < m.count ? 'disabled' : ''} data-m="${m.id}">Start</button>${pool < m.count ? `<small class="muted"> bank has ${pool} of ${m.count}</small>` : ''}`;
      host.appendChild(d);
    });
    host.querySelectorAll('button[data-m]').forEach(b => b.addEventListener('click', () => start(timed.modules.find(m => m.id === b.dataset.m))));
  }
  let mod, items, idx, answers, flags, t0, end, timer, checkpoints, started;
  function start(m) {
    mod = m; const pool = A.shuffle(bank.items.filter(i => i.section === m.section && i.timed_ok !== false));
    // easy to hard like the real test
    items = pool.sort((a, b) => a.difficulty - b.difficulty).slice(0, m.count);
    // rebalance: take a difficulty-stratified sample instead of just the easiest
    const by = { 1: [], 2: [], 3: [] }; pool.forEach(i => by[i.difficulty].push(i));
    const want = { 1: Math.round(m.count * 0.3), 2: Math.round(m.count * 0.45) }; want[3] = m.count - want[1] - want[2];
    let pick = [].concat(by[1].slice(0, want[1]), by[2].slice(0, want[2]), by[3].slice(0, want[3]));
    if (pick.length < m.count) pick = pick.concat(pool.filter(i => !pick.includes(i)).slice(0, m.count - pick.length));
    items = pick.sort((a, b) => a.difficulty - b.difficulty);
    answers = new Array(items.length).fill(null); flags = new Set(); idx = 0; started = {};
    t0 = Date.now(); end = t0 + m.minutes * 60000;
    const per = m.minutes * 60 / m.count;
    checkpoints = profile.timepressure === 'never' ? [] : [1 / 3, 2 / 3].map(f => ({ at: t0 + f * m.minutes * 60000, q: Math.round(f * m.count), fired: false }));
    document.getElementById('mname').textContent = m.name; document.getElementById('pace').textContent = `Pace: ${Math.round(per)}s per question`;
    ['picker', 'review'].forEach(x => document.getElementById(x).hidden = true); document.getElementById('run').hidden = false;
    clearInterval(timer); timer = setInterval(tick, 500); drawNav(); show(0);
  }
  function tick() {
    const left = end - Date.now(); const c = document.getElementById('clock'); c.textContent = A.fmtTime(left / 1000); c.classList.toggle('low', left < 5 * 60000);
    checkpoints.forEach(cp => { if (!cp.fired && Date.now() >= cp.at) { cp.fired = true; const done = answers.filter(a => a !== null).length; coach(done >= cp.q ? `Checkpoint: on pace (${done} answered, target ${cp.q}).` : `Checkpoint: behind pace (${done} answered, target ${cp.q}). Flag the long ones and move.`); } });
    if (profile.timepressure === 'always') { const spent = Date.now() - (started[idx] || Date.now()); if (spent > (mod.minutes * 60 / mod.count) * 2000 && !started['warn' + idx]) { started['warn' + idx] = true; coach('Two questions worth of time on this one. Pick your best guess, flag it, move on.'); } }
    if (left <= 0) finish(true);
  }
  function coach(msg) { const c = document.getElementById('coach'); c.innerHTML = `<div class="coach">${A.esc(msg)}</div>`; setTimeout(() => { if (c.firstChild && c.firstChild.textContent === msg) c.innerHTML = ''; }, 9000); }
  function drawNav() { const n = document.getElementById('navq'); n.innerHTML = items.map((_, i) => `<button data-i="${i}" class="${answers[i] !== null ? 'answered' : ''} ${flags.has(i) ? 'flagged' : ''} ${i === idx ? 'current' : ''}">${i + 1}</button>`).join(''); n.querySelectorAll('button').forEach(b => b.addEventListener('click', () => show(+b.dataset.i))); }
  function show(i) {
    idx = i; started[i] = started[i] || Date.now(); drawNav();
    const item = items[i]; const host = document.getElementById('item'); const free = !item.choices || !item.choices.length; const letters = 'ABCDE';
    host.innerHTML = `${item.passage ? `<div class="card" style="box-shadow:none;background:var(--paper-2)">${A.esc(item.passage).replace(/\n/g, '<br>')}</div>` : ''}<div class="q-stem"><strong>${i + 1}.</strong> ${A.esc(item.stem).replace(/\n/g, '<br>')}</div>
      ${free ? `<input type="text" id="free" inputmode="decimal" placeholder="Your answer" style="max-width:220px" value="${answers[i] !== null ? A.esc(answers[i]) : ''}">` : `<div class="choices">${item.choices.map((c, k) => `<button class="choice" data-k="${k}" ${answers[i] === k ? 'data-state="picked"' : ''}><strong>${letters[k]}.</strong> ${A.esc(c)}</button>`).join('')}</div>`}
      <div class="row" style="margin-top:8px"><button class="ghost" id="flag">${flags.has(i) ? 'Unflag' : 'Flag'}</button></div>`;
    host.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => { answers[i] = +b.dataset.k; host.querySelectorAll('.choice').forEach(x => delete x.dataset.state); b.dataset.state = 'picked'; drawNav(); }));
    const f = host.querySelector('#free'); if (f) f.addEventListener('input', () => { answers[i] = f.value.trim() || null; drawNav(); });
    host.querySelector('#flag').addEventListener('click', () => { flags.has(i) ? flags.delete(i) : flags.add(i); show(i); });
    document.getElementById('next').textContent = i === items.length - 1 ? 'To the end' : 'Next';
  }
  document.getElementById('prev').addEventListener('click', () => show(Math.max(0, idx - 1)));
  document.getElementById('next').addEventListener('click', () => { if (idx < items.length - 1) show(idx + 1); else { const first = answers.findIndex(a => a === null); if (first >= 0) { coach(`${answers.filter(a => a === null).length} unanswered. Second pass: never leave a blank.`); show(first); } else finish(false); } });
  document.getElementById('finish').addEventListener('click', () => { if (confirm('Finish this section now?')) finish(false); });
  async function finish(timeUp) {
    clearInterval(timer); const seconds = Math.round((Date.now() - t0) / 1000);
    let right = 0, unanswered = 0; const rows = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i]; const a = answers[i]; const free = !it.choices || !it.choices.length;
      const correct = a === null ? false : free ? (E.normalize(a) === E.normalize(it.answer) || (it.answer_alt || []).some(x => E.normalize(x) === E.normalize(a))) : a === it.answer;
      if (a === null) unanswered++; if (correct) right++;
      rows.push({ it, a, correct });
      await E.record(test, it, { correct, ms: 0, cause: a === null ? 'time' : null }, 'timed');
    }
    const rec = { id: mod.id, name: mod.name, right, n: items.length, seconds, unanswered, flagged: flags.size, timeUp, at: Date.now() };
    const list = S.get(test + '.timed', []); list.push(rec); S.set(test + '.timed', list.slice(-50));
    if (A.milestone(test, 'timed:' + mod.id + ':' + list.length)) S.set('milestone_pending', { test, text: `${mod.name} done: ${right}/${items.length}. Good time to send a progress report.` });
    document.getElementById('run').hidden = true; document.getElementById('review').hidden = false;
    document.getElementById('rsummary').textContent = `${right} of ${items.length} right in ${A.fmtTime(seconds)}${timeUp ? ' (time ran out)' : ''}. ${unanswered} left blank, ${flags.size} flagged. Misses are in your error log.`;
    document.getElementById('rshow').onclick = () => {
      const host = document.getElementById('rlist'); host.innerHTML = ''; const letters = 'ABCDE';
      rows.forEach(({ it, a, correct }, i) => { const d = document.createElement('div'); d.className = 'card'; d.style.boxShadow = 'none'; const free = !it.choices || !it.choices.length;
        d.innerHTML = `<div class="row" style="justify-content:space-between"><strong>${i + 1}. ${A.esc(bank.skillName[it.skill] || '')}</strong><span class="chip ${correct ? 'ok' : 'bad'}">${correct ? 'right' : a === null ? 'blank' : 'wrong'}</span></div>${it.passage ? `<p class="muted">${A.esc(it.passage).replace(/\n/g, '<br>')}</p>` : ''}<div class="q-stem">${A.esc(it.stem)}</div>${free ? `<p>Your answer: ${A.esc(a ?? '—')} · Key: ${A.esc(it.answer)}</p>` : `<div class="choices">${it.choices.map((c, k) => `<div class="choice" data-state="${k === it.answer ? 'right' : k === a ? 'wrong' : ''}"><strong>${letters[k]}.</strong> ${A.esc(c)}</div>`).join('')}</div>`}<div class="explain">${A.esc(it.explain)}</div>`; host.appendChild(d); });
    };
    document.getElementById('rsend').onclick = () => A.sendReport(test);
  }
  document.addEventListener('alakai:test', load);
  load();
})();
</script>
</body>
</html>
